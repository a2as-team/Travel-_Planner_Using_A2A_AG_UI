    module: travel_planning_system.streamlit_travel_app
    args: [self, query]
  ask_hotel_agent:
    type: sync
    module: travel_planning_system.streamlit_travel_app
    args: [self, query]
  book_car_rental:
    type: sync
    module: travel_planning_system.car_rental_agent_langgraph.simple_car_agent
    args: [self, car_rental_name, check_in, check_out, vehicle_type]
    params:
      returns: str
  book_hotel:
    type: sync
    module: travel_planning_system.hotel_booking_agent_crewai.simple_hotel_agent_with_logging
    args: [self, hotel_name, check_in, check_out, guests]
    params:
      returns: str
  chat:
    type: async
    module: travel_planning_system.car_rental_agent_langgraph.a2a_car_executor
    args: [request]
  check_agent_status:
    type: sync
    module: travel_planning_system.streamlit_travel_app
    args: [self]
  check_agents:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.simple_a2a_executor
  check_env_variables:
    type: sync
    module: travel_planning_system.car_rental_agent_langgraph.debug_env
  coordinate_travel_planning:
    type: async
    module: travel_planning_system.ag_ui_travel_server
    args: [self, travel_request]
    params:
      returns: Dict
  create:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
    args: [cls, remote_agent_addresses]
  create_agent:
    type: sync
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
    args: [self]
    params:
      returns: Agent
  create_travel_itinerary:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
    args: [self, destination, dates, flights, hotels, car_rentals, tool_context]
  direct_agent_communication:
    type: async
    module: travel_planning_system.ag_ui_travel_server
    args: [self, travel_request]
    params:
      returns: Dict
  display_options:
    type: sync
    module: travel_planning_system.streamlit_travel_app
    args: [title, options_json, option_type]
  ensure_log_file:
    type: sync
    module: travel_planning_system.travel_planner_agent_adk.simple_a2a_agent
    args: [self]
  extract_car_options:
    type: sync
    module: travel_planning_system.streamlit_travel_app
    args: [car_response]
  extract_destination:
    type: sync
    module: travel_planning_system.travel_planner_agent_adk.simple_travel_planner
    args: [self, query]
  get_agent_card:
    type: async
    module: travel_planning_system.car_rental_agent_langgraph.a2a_car_executor
  get_agent_response:
