    module: travel_planning_system.travel_planner_agent_adk.simple_travel_planner
  websocket_endpoint:
    type: async
    module: travel_planning_system.ag_ui_travel_server
    args: [websocket]

variables:
  GROQ_API_KEY:
    type: env
    params:
      caller: [os.getenv, ChatGroq]
      path: [travel_planning_system.ag_ui_travel_server, travel_planning_system.travel_planner_agent_adk.travel_planner.agent,
        travel_planning_system.car_rental_agent_langgraph.app.simple_car_agent, travel_planning_system.hotel_booking_agent_crewai.simple_hotel_agent,
        travel_planning_system.hotel_booking_agent_crewai.simple_hotel_agent_with_logging, travel_planning_system.car_rental_agent_langgraph.debug_env,
        travel_planning_system.travel_planner_agent_adk.simple_travel_planner, travel_planning_system.streamlit_travel_app,
        travel_planning_system.car_rental_agent_langgraph.app.agent, travel_planning_system.car_rental_agent_langgraph.simple_car_agent]
  SERPER_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [travel_planning_system.car_rental_agent_langgraph.app.simple_car_agent, travel_planning_system.hotel_booking_agent_crewai.simple_hotel_agent,
        travel_planning_system.hotel_booking_agent_crewai.simple_hotel_agent_with_logging, travel_planning_system.car_rental_agent_langgraph.debug_env,
        travel_planning_system.car_rental_agent_langgraph.app.agent, travel_planning_system.car_rental_agent_langgraph.simple_car_agent]
  var:
    type: env
    params:
      caller: [os.getenv]
      path: [travel_planning_system.start_ag_ui_server]

files:
  .env:
    type: literal
    actions: [read]
    params:
      caller: [check_env_variables, open]

networks:
  google.serper.dev:
    type: api
    actions: [POST]
    urls: [/search]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [search_flights, search_destinations, search_car_rentals]
  localhost:
    type: api
    actions: [GET]
    urls: [/]
    protocols: [http]
    ports: ["10002", "10003"]
    params:
      caller: [get_agent_card]
      links: [url]
