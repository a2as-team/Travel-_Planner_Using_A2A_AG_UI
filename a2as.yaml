    type: async
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
    args: [self, destination, tool_context]
  search_flights:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
    args: [self, origin, destination, date, tool_context]
  search_hotels:
    type: sync
    module: travel_planning_system.hotel_booking_agent_crewai.simple_hotel_agent_with_logging
    args: [self, location, check_in, check_out, budget]
    params:
      returns: str
  send_a2a_message:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.simple_a2a_agent
    args: [self, agent_url, message]
    params:
      returns: Dict
  send_message:
    type: async
    module: travel_planning_system.hotel_booking_agent_crewai.agent_executor
    args: [request]
    params:
      returns: SendMessageResponse
  setup_middleware:
    type: sync
    module: travel_planning_system.ag_ui_travel_server
    args: [self]
  setup_routes:
    type: sync
    module: travel_planning_system.ag_ui_travel_server
    args: [self]
  start_ag_ui_server:
    type: sync
    module: travel_planning_system.start_ag_ui_server
  startup_event:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.simple_executor_with_logging
