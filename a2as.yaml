    type: sync
    module: travel_planning_system.travel_planner_agent_adk.simple_a2a_agent
    args: [self, session_id, agent_name, request, response, status]
  main:
    type: sync
    module: travel_planning_system.streamlit_travel_app
  plan_trip:
    type: sync
    module: travel_planning_system.streamlit_travel_app
    args: [self, destination, check_in, check_out, budget, guests, car_needed]
  print_usage_instructions:
    type: sync
    module: travel_planning_system.start_ag_ui_server
  process_request:
    type: sync
    module: travel_planning_system.car_rental_agent_langgraph.simple_car_agent
    args: [self, message]
