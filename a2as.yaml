    module: travel_planning_system.car_rental_agent_langgraph.simple_car_agent
    args: [self]
  _async_init_components:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
    args: [self, remote_agent_addresses]
  _async_main:
    type: async
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
  _get_initialized_travel_planner_agent_sync:
    type: sync
    module: travel_planning_system.travel_planner_agent_adk.travel_planner.agent
  _log_trace:
    type: sync
    module: travel_planning_system.car_rental_agent_langgraph.simple_car_agent
